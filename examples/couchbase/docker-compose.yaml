version: "3"
services:
  couchbase:
    image: couchbase:enterprise-7.1.0@sha256:6ea8fc49bde775bb4999f59add71dc7e016c7ec6c00a286729c395a1948c0356
    ports:
      - 8091:8091
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1512M
  opentelemetry-collector-contrib:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yml
    depends_on:
      - couchbase
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    volumes:
      - ./prometheus-config.yaml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
